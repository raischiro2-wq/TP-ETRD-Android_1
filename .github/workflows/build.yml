name: Build Android Dusk

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q TP_ETRD_project_payload.zip -d project

      - name: Install Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;29.0.14206865

      - name: Configure
        working-directory: project
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Build
        working-directory: project
        run: cmake --build build --parallel

      - name: Upload Dusk
        uses: actions/upload-artifact@v4
        with:
          name: TP_ETRD_Android
          path: project/build/mods/*.dusk
          if-no-files-found: error
